<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Showerfest de Thiago 🚀</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="space-background" aria-hidden="true">
    <div class="nebula nebula-one"></div>
    <div class="nebula nebula-two"></div>
    <div class="nebula nebula-three"></div>

    <div class="stars" id="stars"></div>
</div>
    <main>

        <section class="hero">

            <div class="hero-content">

                <span class="eyebrow">
                    Una nueva estrella se aproxima
                </span>

                <h1>
                    Showerfest de
                    <strong>Thiago</strong>
                </h1>

                <p>
                    Una misión muy especial está por comenzar
                    en nuestra galaxia.
                </p>

                <button id="mission-button" type="button">
                    🚀 Comenzar misión
                </button>

            </div>

        </section>

        <section class="mission-section" id="mission">

            <div class="section-content">

                <span class="section-label">
                    Primera coordenada
                </span>

                <h2>
                    Nuestra aventura está comenzando
                </h2>

                <p>
                    Muy pronto compartiremos contigo la historia,
                    los detalles del evento y la lista de regalos
                    para nuestro pequeño astronauta.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
